<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NiFi Dark Mode — Clusters</title>
<style>
  :root {
    --bg: #12171d;
    --card: #1b222b;
    --line: #2a343f;
    --text: #e8eef2;
    --muted: #8a9ba8;
    --accent: #30ee85;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 20px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 13px; }

  .list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .url { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .remove {
    flex: none;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px 8px;
  }
  .remove:hover { color: #ff6b6b; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }

  form { display: grid; grid-template-columns: 1.1fr 1.6fr .9fr auto; gap: 10px; align-items: center; }

  select, input {
    width: 100%;
    background: #141b22;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 10px;
    font: inherit;
  }

  button.add {
    background: var(--accent);
    color: #0a140d;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .empty { color: var(--muted); font-size: 13px; padding: 4px 0 16px; }

  @media (max-width: 560px) {
    form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>NiFi Clusterları</h1>
    <p class="sub">Production olarak işaretlenen cluster'da ekranın çevresine kırmızı çerçeve çizilir. Adres, NiFi'yi açtığınız adresle aynı olmalıdır.</p>

    <div class="list" id="list"></div>

    <div class="card">
      <form id="form">
        <input id="name" placeholder="İsim (örn. Prod)" required>
        <input id="url" type="url" placeholder="https://nifi.example.com/nifi" required>
        <select id="env">
          <option value="prod">Production</option>
          <option value="test">Test</option>
          <option value="dev">Development</option>
          <option value="other">Diğer</option>
        </select>
        <button type="submit" class="add">Ekle</button>
      </form>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
