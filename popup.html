<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>NiFi Dark Mode</title>
<style>
  :root {
    --bg: #12171d;
    --card: #1b222b;
    --line: #2a343f;
    --text: #e8eef2;
    --muted: #8a9ba8;
    --accent: #30ee85;
    --off: #3a4653;
  }

  * { box-sizing: border-box; }

  body {
    width: 280px;
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

  .logo { width: 32px; height: 32px; border-radius: 9px; }

  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .sub { margin: 0; font-size: 12px; color: var(--muted); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color .2s;
  }
  .row:hover { border-color: #3b4957; }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .label { font-weight: 600; }
  .state { margin-top: 2px; font-size: 12px; color: var(--muted); transition: color .2s; }
  .row[aria-checked="true"] .state { color: var(--accent); }

  .switch {
    position: relative;
    flex: none;
    width: 46px;
    height: 26px;
    border-radius: 13px;
    background: var(--off);
    transition: background .2s;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
    transition: transform .2s;
  }
  .row[aria-checked="true"] .switch { background: var(--accent); }
  .row[aria-checked="true"] .switch::after { transform: translateX(20px); }

  .hint { margin: 12px 2px 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <img class="logo" src="icons/icon48.png" alt="" width="32" height="32">
    <div>
      <h1>NiFi Dark Mode</h1>
      <p class="sub">Apache NiFi için karanlık tema</p>
    </div>
  </header>

  <button class="row" id="toggle" role="switch" aria-checked="true">
    <span>
      <div class="label">Karanlık tema</div>
      <div class="state" id="state">Açık</div>
    </span>
    <span class="switch" aria-hidden="true"></span>
  </button>

  <p class="hint">Değişiklik açık olan NiFi sekmelerine anında uygulanır.</p>

  <script src="popup.js"></script>
</body>
</html>
